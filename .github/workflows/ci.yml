name: LedgerFlow CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build, Lint & Verify Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ledgerflow
          REDIS_URL: redis://localhost:6379
          WEBHOOK_SECRET: ci-secret-key-12345
        run: npm run migrate

      - name: Build Production Artifacts
        run: npm run build

      - name: Run Test Suite (Vitest)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ledgerflow
          REDIS_URL: redis://localhost:6379
          WEBHOOK_SECRET: ci-secret-key-12345
          NODE_ENV: test
        run: npm test
