<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#111217; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#73BF69" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#73BF69" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5794F2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5794F2" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#181B1F" />
  <circle cx="28" cy="26" r="12" fill="#F47C36" />
  <path d="M24 26 L32 20 L32 32 Z" fill="#FFFFFF" />
  <text x="50" y="32" fill="#CCCCDC" font-size="15" font-weight="600">LedgerFlow / Dashboards / Production &amp; Observability Overview</text>
  
  <rect x="910" y="14" width="125" height="25" rx="3" fill="#22252B" stroke="#343741" stroke-width="1"/>
  <circle cx="924" cy="26" r="4" fill="#73BF69" />
  <text x="935" y="31" fill="#CCCCDC" font-size="11">Last 15 minutes</text>

  <rect x="1045" y="14" width="60" height="25" rx="3" fill="#22252B" stroke="#343741" stroke-width="1"/>
  <text x="1058" y="31" fill="#CCCCDC" font-size="11">⏱ 5s</text>

  <rect x="1115" y="14" width="65" height="25" rx="3" fill="#3274D9" />
  <text x="1128" y="31" fill="#FFFFFF" font-size="11" font-weight="600">Save</text>

  <!-- ROW 1: System Invariants & Key Gauges -->
  <!-- Panel 1: Ledger Balance Invariant -->
  <g filter="url(#cardShadow)">
    <rect x="16" y="66" width="278" height="135" rx="4" fill="#181B1F" stroke="#262A33" stroke-width="1"/>
    <text x="32" y="92" fill="#8E8E9E" font-size="12" font-weight="600">Ledger Balance Invariant (Paise)</text>
    <text x="32" y="145" fill="#73BF69" font-size="44" font-weight="700">0</text>
    <text x="65" y="145" fill="#73BF69" font-size="14" font-weight="500">paise discrepancy</text>
    <rect x="32" y="162" width="135" height="20" rx="3" fill="#1E3024"/>
    <text x="40" y="176" fill="#73BF69" font-size="11" font-weight="600">✓ Balance Conserved</text>
  </g>

  <!-- Panel 2: Transfer Success Rate -->
  <g filter="url(#cardShadow)">
    <rect x="310" y="66" width="278" height="135" rx="4" fill="#181B1F" stroke="#262A33" stroke-width="1"/>
    <text x="326" y="92" fill="#8E8E9E" font-size="12" font-weight="600">Transfer Success Rate</text>
    <text x="326" y="145" fill="#73BF69" font-size="44" font-weight="700">99.98%</text>
    <path d="M480 150 Q520 125 540 135 T570 120" fill="none" stroke="#73BF69" stroke-width="2"/>
    <path d="M480 150 Q520 125 540 135 T570 120 L570 180 L480 180 Z" fill="url(#greenGlow)"/>
    <text x="326" y="176" fill="#8E8E9E" font-size="11">5m rate: 142 req/s</text>
  </g>

  <!-- Panel 3: Idempotency Replays Total -->
  <g filter="url(#cardShadow)">
    <rect x="604" y="66" width="278" height="135" rx="4" fill="#181B1F" stroke="#262A33" stroke-width="1"/>
    <text x="620" y="92" fill="#8E8E9E" font-size="12" font-weight="600">Idempotency Replays Served</text>
    <text x="620" y="145" fill="#5794F2" font-size="44" font-weight="700">1,428</text>
    <path d="M770 155 Q800 135 830 142 T865 125" fill="none" stroke="#5794F2" stroke-width="2"/>
    <path d="M770 155 Q800 135 830 142 T865 125 L865 180 L770 180 Z" fill="url(#blueGlow)"/>
    <text x="620" y="176" fill="#8E8E9E" font-size="11">100% duplicate funds protected</text>
  </g>

  <!-- Panel 4: Open Circuit Breakers -->
  <g filter="url(#cardShadow)">
    <rect x="898" y="66" width="286" height="135" rx="4" fill="#181B1F" stroke="#262A33" stroke-width="1"/>
    <text x="914" y="92" fill="#8E8E9E" font-size="12" font-weight="600">Open Circuit Breakers</text>
    <text x="914" y="145" fill="#73BF69" font-size="44" font-weight="700">0</text>
    <text x="948" y="145" fill="#8E8E9E" font-size="14">/ 12 active endpoints</text>
    <rect x="914" y="162" width="130" height="20" rx="3" fill="#1E3024"/>
    <text x="922" y="176" fill="#73BF69" font-size="11" font-weight="600">✓ All Endpoints Healthy</text>
  </g>

  <!-- ROW 2: Latencies and Throughput -->
  <!-- Panel 5: HTTP Request Latency (p50 / p95 / p99) -->
  <g filter="url(#cardShadow)">
    <rect x="16" y="215" width="572" height="255" rx="4" fill="#181B1F" stroke="#262A33" stroke-width="1"/>
    <text x="32" y="242" fill="#CCCCDC" font-size="13" font-weight="600">HTTP Request Duration (Histogram Quantiles)</text>
    <line x1="32" y1="260" x2="568" y2="260" stroke="#262A33" stroke-width="1"/>
    <line x1="32" y1="310" x2="568" y2="310" stroke="#262A33" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="32" y1="360" x2="568" y2="360" stroke="#262A33" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="32" y1="410" x2="568" y2="410" stroke="#262A33" stroke-width="1" stroke-dasharray="3,3"/>
    
    <text x="572" y="264" fill="#5A5D6B" font-size="10" text-anchor="end">50ms</text>
    <text x="572" y="314" fill="#5A5D6B" font-size="10" text-anchor="end">25ms</text>
    <text x="572" y="364" fill="#5A5D6B" font-size="10" text-anchor="end">10ms</text>
    <text x="572" y="414" fill="#5A5D6B" font-size="10" text-anchor="end">0ms</text>

    <!-- p99 line (Orange) -->
    <path d="M40 330 C120 310, 200 340, 280 290 C360 310, 440 280, 550 300" fill="none" stroke="#FF9830" stroke-width="2"/>
    <!-- p95 line (Yellow) -->
    <path d="M40 370 C120 350, 200 365, 280 340 C360 345, 440 335, 550 340" fill="none" stroke="#FADE2A" stroke-width="2"/>
    <!-- p50 line (Green) -->
    <path d="M40 395 C120 390, 200 398, 280 388 C360 392, 440 385, 550 390" fill="none" stroke="#73BF69" stroke-width="2"/>

    <!-- Legend -->
    <rect x="40" y="440" width="10" height="10" fill="#73BF69" rx="2"/>
    <text x="56" y="449" fill="#CCCCDC" font-size="11">p50: 8.2ms</text>
    <rect x="150" y="440" width="10" height="10" fill="#FADE2A" rx="2"/>
    <text x="166" y="449" fill="#CCCCDC" font-size="11">p95: 22.4ms</text>
    <rect x="260" y="440" width="10" height="10" fill="#FF9830" rx="2"/>
    <text x="276" y="449" fill="#CCCCDC" font-size="11">p99: 45.1ms</text>
  </g>

  <!-- Panel 6: Transfers Throughput by Outcome -->
  <g filter="url(#cardShadow)">
    <rect x="604" y="215" width="580" height="255" rx="4" fill="#181B1F" stroke="#262A33" stroke-width="1"/>
    <text x="620" y="242" fill="#CCCCDC" font-size="13" font-weight="600">Transfers Throughput by Outcome (Rate)</text>
    <line x1="620" y1="260" x2="1164" y2="260" stroke="#262A33" stroke-width="1"/>
    <line x1="620" y1="310" x2="1164" y2="310" stroke="#262A33" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="620" y1="360" x2="1164" y2="360" stroke="#262A33" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="620" y1="410" x2="1164" y2="410" stroke="#262A33" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Stacked bars representation -->
    <g transform="translate(635, 270)">
      <!-- Bar 1 -->
      <rect x="0" y="10" width="22" height="130" fill="#73BF69"/>
      <rect x="0" y="0" width="22" height="10" fill="#5794F2"/>
      <!-- Bar 2 -->
      <rect x="45" y="15" width="22" height="125" fill="#73BF69"/>
      <rect x="45" y="5" width="22" height="10" fill="#5794F2"/>
      <!-- Bar 3 -->
      <rect x="90" y="8" width="22" height="132" fill="#73BF69"/>
      <rect x="90" y="0" width="22" height="8" fill="#5794F2"/>
      <!-- Bar 4 -->
      <rect x="135" y="20" width="22" height="120" fill="#73BF69"/>
      <rect x="135" y="10" width="22" height="10" fill="#F2495C"/>
      <!-- Bar 5 -->
      <rect x="180" y="12" width="22" height="128" fill="#73BF69"/>
      <rect x="180" y="4" width="22" height="8" fill="#5794F2"/>
      <!-- Bar 6 -->
      <rect x="225" y="5" width="22" height="135" fill="#73BF69"/>
      <!-- Bar 7 -->
      <rect x="270" y="10" width="22" height="130" fill="#73BF69"/>
      <!-- Bar 8 -->
      <rect x="315" y="15" width="22" height="125" fill="#73BF69"/>
      <!-- Bar 9 -->
      <rect x="360" y="8" width="22" height="132" fill="#73BF69"/>
      <!-- Bar 10 -->
      <rect x="405" y="12" width="22" height="128" fill="#73BF69"/>
      <!-- Bar 11 -->
      <rect x="450" y="6" width="22" height="134" fill="#73BF69"/>
    </g>

    <!-- Legend -->
    <rect x="625" y="440" width="10" height="10" fill="#73BF69" rx="2"/>
    <text x="641" y="449" fill="#CCCCDC" font-size="11">created: 142/s</text>
    <rect x="735" y="440" width="10" height="10" fill="#5794F2" rx="2"/>
    <text x="751" y="449" fill="#CCCCDC" font-size="11">replay: 12/s</text>
    <rect x="835" y="440" width="10" height="10" fill="#F2495C" rx="2"/>
    <text x="851" y="449" fill="#CCCCDC" font-size="11">insufficient_funds: 1/s</text>
    <rect x="980" y="440" width="10" height="10" fill="#B877D9" rx="2"/>
    <text x="996" y="449" fill="#CCCCDC" font-size="11">conflict: 0/s</text>
  </g>

  <!-- ROW 3: Outbox Queue, Webhooks & Breaker State -->
  <!-- Panel 7: Outbox Queue Depth by Status -->
  <g filter="url(#cardShadow)">
    <rect x="16" y="485" width="375" height="265" rx="4" fill="#181B1F" stroke="#262A33" stroke-width="1"/>
    <text x="32" y="512" fill="#CCCCDC" font-size="13" font-weight="600">Transactional Outbox Queue Depth</text>
    
    <g transform="translate(32, 530)">
      <rect x="0" y="0" width="343" height="40" rx="3" fill="#22252B"/>
      <circle cx="15" cy="20" r="5" fill="#FADE2A"/>
      <text x="30" y="24" fill="#CCCCDC" font-size="12">PENDING (In flight / backoff)</text>
      <text x="320" y="25" fill="#FADE2A" font-size="14" font-weight="700" text-anchor="end">3</text>
    </g>
    
    <g transform="translate(32, 580)">
      <rect x="0" y="0" width="343" height="40" rx="3" fill="#22252B"/>
      <circle cx="15" cy="20" r="5" fill="#73BF69"/>
      <text x="30" y="24" fill="#CCCCDC" font-size="12">DELIVERED (Acknowledged 2xx)</text>
      <text x="320" y="25" fill="#73BF69" font-size="14" font-weight="700" text-anchor="end">12,480</text>
    </g>

    <g transform="translate(32, 630)">
      <rect x="0" y="0" width="343" height="40" rx="3" fill="#22252B"/>
      <circle cx="15" cy="20" r="5" fill="#73BF69"/>
      <text x="30" y="24" fill="#CCCCDC" font-size="12">DEAD_LETTER (Exhausted retries)</text>
      <text x="320" y="25" fill="#73BF69" font-size="14" font-weight="700" text-anchor="end">0</text>
    </g>
    <text x="32" y="715" fill="#8E8E9E" font-size="11">Max delivery attempts before dead letter: 5</text>
  </g>

  <!-- Panel 8: Webhook Deliveries & Retries -->
  <g filter="url(#cardShadow)">
    <rect x="407" y="485" width="375" height="265" rx="4" fill="#181B1F" stroke="#262A33" stroke-width="1"/>
    <text x="423" y="512" fill="#CCCCDC" font-size="13" font-weight="600">Webhook Deliveries &amp; Retries Rate</text>
    <line x1="423" y1="535" x2="766" y2="535" stroke="#262A33" stroke-width="1"/>
    <line x1="423" y1="585" x2="766" y2="585" stroke="#262A33" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="423" y1="635" x2="766" y2="635" stroke="#262A33" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="423" y1="685" x2="766" y2="685" stroke="#262A33" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Delivery rate line (Green) -->
    <path d="M430 630 C490 610, 560 625, 620 570 C680 590, 720 560, 760 565" fill="none" stroke="#73BF69" stroke-width="2"/>
    <path d="M430 630 C490 610, 560 625, 620 570 C680 590, 720 560, 760 565 L760 685 L430 685 Z" fill="url(#greenGlow)"/>

    <!-- Legend -->
    <rect x="430" y="715" width="10" height="10" fill="#73BF69" rx="2"/>
    <text x="446" y="724" fill="#CCCCDC" font-size="11">success (2xx)</text>
    <rect x="540" y="715" width="10" height="10" fill="#F2495C" rx="2"/>
    <text x="556" y="724" fill="#CCCCDC" font-size="11">failure (5xx)</text>
    <rect x="650" y="715" width="10" height="10" fill="#FF9830" rx="2"/>
    <text x="666" y="724" fill="#CCCCDC" font-size="11">circuit_breaker_open</text>
  </g>

  <!-- Panel 9: Circuit Breaker States per Endpoint -->
  <g filter="url(#cardShadow)">
    <rect x="798" y="485" width="386" height="265" rx="4" fill="#181B1F" stroke="#262A33" stroke-width="1"/>
    <text x="814" y="512" fill="#CCCCDC" font-size="13" font-weight="600">Circuit Breaker &amp; Rate Limits by Endpoint</text>

    <!-- Table Header -->
    <rect x="814" y="530" width="354" height="26" fill="#22252B"/>
    <text x="824" y="547" fill="#8E8E9E" font-size="11" font-weight="600">ENDPOINT ID</text>
    <text x="960" y="547" fill="#8E8E9E" font-size="11" font-weight="600">STATE</text>
    <text x="1060" y="547" fill="#8E8E9E" font-size="11" font-weight="600">FAILURES</text>
    <text x="1145" y="547" fill="#8E8E9E" font-size="11" font-weight="600" text-anchor="end">RATE</text>

    <!-- Row 1 -->
    <line x1="814" y1="588" x2="1168" y2="588" stroke="#262A33" stroke-width="1"/>
    <text x="824" y="575" fill="#5794F2" font-size="11" font-family="monospace">00000000...0002</text>
    <rect x="955" y="562" width="60" height="18" rx="3" fill="#1E3024"/>
    <text x="962" y="575" fill="#73BF69" font-size="10" font-weight="600">CLOSED</text>
    <text x="1080" y="575" fill="#CCCCDC" font-size="11">0 / 10</text>
    <text x="1145" y="575" fill="#CCCCDC" font-size="11" text-anchor="end">10/s</text>

    <!-- Row 2 -->
    <line x1="814" y1="620" x2="1168" y2="620" stroke="#262A33" stroke-width="1"/>
    <text x="824" y="607" fill="#5794F2" font-size="11" font-family="monospace">1bfcf399...edc6</text>
    <rect x="955" y="594" width="60" height="18" rx="3" fill="#1E3024"/>
    <text x="962" y="607" fill="#73BF69" font-size="10" font-weight="600">CLOSED</text>
    <text x="1080" y="607" fill="#CCCCDC" font-size="11">0 / 10</text>
    <text x="1145" y="607" fill="#CCCCDC" font-size="11" text-anchor="end">10/s</text>

    <!-- Row 3 -->
    <line x1="814" y1="652" x2="1168" y2="652" stroke="#262A33" stroke-width="1"/>
    <text x="824" y="639" fill="#5794F2" font-size="11" font-family="monospace">ea3651b5...1f34</text>
    <rect x="955" y="626" width="60" height="18" rx="3" fill="#3D1D20"/>
    <text x="970" y="639" fill="#F2495C" font-size="10" font-weight="600">OPEN</text>
    <text x="1080" y="639" fill="#F2495C" font-size="11">10 / 10</text>
    <text x="1145" y="639" fill="#CCCCDC" font-size="11" text-anchor="end">Paused</text>

    <!-- Row 4 -->
    <line x1="814" y1="684" x2="1168" y2="684" stroke="#262A33" stroke-width="1"/>
    <text x="824" y="671" fill="#5794F2" font-size="11" font-family="monospace">e47271f2...23d</text>
    <rect x="955" y="658" width="60" height="18" rx="3" fill="#1E3024"/>
    <text x="962" y="671" fill="#73BF69" font-size="10" font-weight="600">CLOSED</text>
    <text x="1080" y="671" fill="#CCCCDC" font-size="11">0 / 10</text>
    <text x="1145" y="671" fill="#CCCCDC" font-size="11" text-anchor="end">10/s</text>

    <text x="814" y="720" fill="#8E8E9E" font-size="11">Automatic fallback &amp; probe recovery enabled</text>
  </g>
</svg>
