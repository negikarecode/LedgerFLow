<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedgerFlow — Chaos Simulator & Idempotent Double-Entry Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          colors: {
            darkBg: '#09090b',
            darkCard: '#111113',
            darkBorder: '#27272a',
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Clean subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(150, 150, 150, 0.4);
    }
  </style>
</head>
<body class="min-h-screen bg-[#f8fafc] text-[#0f172a] dark:bg-[#09090b] dark:text-[#fafafa] antialiased selection:bg-slate-200 dark:selection:bg-zinc-800 transition-colors duration-150">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function formatPaise(paise) {
      if (paise === undefined || paise === null) return '₹0.00';
      const inr = (Number(paise) / 100).toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
      return `₹${inr}`;
    }

    function formatTime(isoStr) {
      if (!isoStr) return '—';
      const d = new Date(isoStr);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function truncateId(id) {
      if (!id) return '';
      return `${id.slice(0, 8)}…${id.slice(-4)}`;
    }

    function App() {
      // 1. Theme State (defaults to system preference, stored in localStorage)
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('theme');
        if (saved) return saved;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      });

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme((prev) => (prev === 'dark' ? 'light' : 'dark'));
      };

      // 2. Data State
      const [accounts, setAccounts] = useState([]);
      const [selectedAccountId, setSelectedAccountId] = useState(null);
      const [accountLedger, setAccountLedger] = useState(null);
      const [outboxEvents, setOutboxEvents] = useState([]);
      const [merchantStatus, setMerchantStatus] = useState({ crashMode: false, receivedEvents: [] });
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Active Tab in Right Column: 'wallets' | 'outbox'
      const [activeTab, setActiveTab] = useState('wallets');

      // 3. Transfer Form State
      const [fromAcc, setFromAcc] = useState('');
      const [toAcc, setToAcc] = useState('');
      const [transferAmountInr, setTransferAmountInr] = useState('250');
      const [sendWebhook, setSendWebhook] = useState(true);

      // 4. Chaos Test State
      const [chaosLoading, setChaosLoading] = useState(false);
      const [doubleTapResult, setDoubleTapResult] = useState(null);
      const [raceConditionResult, setRaceConditionResult] = useState(null);

      // 5. Collapsible Create Wallet State
      const [isCreateOpen, setIsCreateOpen] = useState(false);
      const [newOwner, setNewOwner] = useState('');
      const [newSeedInr, setNewSeedInr] = useState('500');

      const DEMO_API_KEY = 'lf_live_demo_key_for_chaos_simulator_1234567890';
      const authHeaders = {
        'Authorization': `Bearer ${DEMO_API_KEY}`,
      };

      const showToast = (message, type = 'info') => {
        setToast({ message, type, id: Date.now() });
        setTimeout(() => setToast(null), 3500);
      };

      // Polling and API Fetchers
      const fetchAccounts = async () => {
        try {
          const res = await fetch('/accounts?limit=50', { headers: authHeaders });
          const data = await res.json();
          if (data.data) {
            setAccounts(data.data);
            if (!selectedAccountId && data.data.length > 0) {
              const firstId = data.data[0].id;
              setSelectedAccountId(firstId);
              fetchLedger(firstId);
            }
            // Auto-populate from/to if unset
            if (!fromAcc && data.data.length > 0) setFromAcc(data.data[0].id);
            if (!toAcc && data.data.length > 1) setToAcc(data.data[1].id);
          }
        } catch (e) {
          console.error('Error fetching accounts:', e);
        }
      };

      const fetchLedger = async (id) => {
        if (!id) return;
        try {
          const res = await fetch(`/accounts/${id}/ledger`, { headers: authHeaders });
          if (res.ok) {
            const data = await res.json();
            setAccountLedger(data);
          }
        } catch (e) {
          console.error('Error fetching ledger:', e);
        }
      };

      const fetchOutbox = async () => {
        try {
          const res = await fetch('/outbox?limit=50', { headers: authHeaders });
          const data = await res.json();
          if (data.data) setOutboxEvents(data.data);
        } catch (e) {
          console.error('Error fetching outbox:', e);
        }
      };

      const fetchMerchant = async () => {
        try {
          const res = await fetch('/mock-merchant/status');
          const data = await res.json();
          setMerchantStatus(data);
        } catch (e) {
          console.error('Error fetching merchant:', e);
        }
      };

      const refreshAll = async () => {
        await Promise.all([fetchAccounts(), fetchOutbox(), fetchMerchant()]);
        if (selectedAccountId) fetchLedger(selectedAccountId);
      };

      useEffect(() => {
        refreshAll();
        const interval = setInterval(refreshAll, 2000);
        return () => clearInterval(interval);
      }, [selectedAccountId]);

      // Reset Demo Action
      const handleResetDemo = async () => {
        setLoading(true);
        try {
          // Call POST /demo/reset to truncate tables and seed Alice Sharma & Bob Patel
          const res = await fetch('/demo/reset', { method: 'POST' });
          const data = await res.json();

          let alice = null;
          let bob = null;

          if (data.accounts && data.accounts.length >= 2) {
            alice = data.accounts.find((a) => a.owner_name.includes('Alice')) || data.accounts[0];
            bob = data.accounts.find((a) => a.owner_name.includes('Bob')) || data.accounts[1];
          }

          if (alice) {
            setSelectedAccountId(alice.id);
            setFromAcc(alice.id);
            fetchLedger(alice.id);
          }
          if (bob) {
            setToAcc(bob.id);
          }

          setTransferAmountInr('250');
          setDoubleTapResult(null);
          setRaceConditionResult(null);

          showToast('Demo reset: Alice Sharma (₹1,000) & Bob Patel (₹500) ready', 'success');
          await refreshAll();
        } catch (err) {
          showToast('Failed to reset demo: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      // Create Account
      const handleCreateAccount = async (e) => {
        e.preventDefault();
        if (!newOwner.trim()) return;
        try {
          const paise = Math.round((Number(newSeedInr) || 0) * 100);
          const res = await fetch('/accounts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHeaders },
            body: JSON.stringify({
              owner_name: newOwner.trim(),
              currency: 'INR',
              initial_credit_paise: paise,
            }),
          });
          const data = await res.json();
          if (res.ok) {
            showToast(`Created wallet for ${data.owner_name} with ${formatPaise(data.balance_paise)}`, 'success');
            setNewOwner('');
            setNewSeedInr('500');
            setIsCreateOpen(false);
            fetchAccounts();
            setSelectedAccountId(data.id);
          } else {
            showToast(data.message || 'Failed to create account', 'error');
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      // Execute Single Transfer
      const handleTransfer = async (e) => {
        e.preventDefault();
        if (!fromAcc || !toAcc) {
          showToast('Select both From and To wallets', 'error');
          return;
        }
        if (fromAcc === toAcc) {
          showToast('Sender and receiver must be different accounts', 'error');
          return;
        }

        const amountPaise = Math.round(Number(transferAmountInr) * 100);
        if (!amountPaise || amountPaise <= 0) {
          showToast('Enter a valid transfer amount', 'error');
          return;
        }

        try {
          const idempotencyKey = 'web-' + crypto.randomUUID();

          const res = await fetch('/transfers', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Idempotency-Key': idempotencyKey,
              ...authHeaders,
            },
            body: JSON.stringify({
              from_account_id: fromAcc,
              to_account_id: toAcc,
              amount_paise: amountPaise,
            }),
          });

          const data = await res.json();
          if (res.ok) {
            showToast(`Transferred ₹${transferAmountInr} successfully`, 'success');
            refreshAll();
          } else {
            showToast(data.message || 'Transfer failed', 'error');
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      // Chaos 1: Double-Tap (20x same key)
      const runDoubleTap = async () => {
        if (!fromAcc || !toAcc) {
          showToast('Select From and To wallets for Double-Tap test', 'error');
          return;
        }
        setChaosLoading(true);
        setDoubleTapResult(null);

        const sharedKey = 'double-tap-' + crypto.randomUUID();
        const amountPaise = Math.round(Number(transferAmountInr) * 100) || 10000;

        try {
          const requests = Array.from({ length: 20 }, () =>
            fetch('/transfers', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Idempotency-Key': sharedKey,
                ...authHeaders,
              },
              body: JSON.stringify({
                from_account_id: fromAcc,
                to_account_id: toAcc,
                amount_paise: amountPaise,
              }),
            }).then(async (res) => ({
              status: res.status,
              isReplay: res.headers.get('x-idempotent-replay') === 'true',
              body: await res.json(),
            }))
          );

          const results = await Promise.all(requests);
          const firstExecutions = results.filter((r) => r.status === 201 && !r.isReplay).length;
          const replays = results.filter((r) => r.status === 201 && r.isReplay).length;
          const inProgress = results.filter((r) => r.status === 409).length;
          const errors = results.filter((r) => r.status !== 201 && r.status !== 409).length;

          setDoubleTapResult({
            total: 20,
            firstExecutions,
            replays,
            inProgress,
            errors,
          });

          showToast('Double-Tap complete: ledger debited exactly once', 'success');
          refreshAll();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setChaosLoading(false);
        }
      };

      // Chaos 2: Overdraft Race Condition (20x parallel)
      const runRaceCondition = async () => {
        if (!fromAcc || !toAcc) {
          showToast('Select From and To wallets for Race Condition test', 'error');
          return;
        }

        setChaosLoading(true);
        setRaceConditionResult(null);

        let initialBalance = 0;
        try {
          const lRes = await fetch(`/accounts/${fromAcc}/ledger`, { headers: authHeaders });
          const lData = await lRes.json();
          initialBalance = lData.balance_paise || 0;
        } catch {}

        const singlePaise = 20000; // ₹200 per attempt

        try {
          const requests = Array.from({ length: 20 }, (_, i) =>
            fetch('/transfers', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Idempotency-Key': `race-${i}-${crypto.randomUUID()}`,
                ...authHeaders,
              },
              body: JSON.stringify({
                from_account_id: fromAcc,
                to_account_id: toAcc,
                amount_paise: singlePaise,
              }),
            }).then(async (res) => ({
              status: res.status,
              body: await res.json(),
            }))
          );

          const results = await Promise.all(requests);
          const successes = results.filter((r) => r.status === 201).length;
          const insufficient = results.filter((r) => r.status === 422).length;
          const otherErrors = results.filter((r) => r.status !== 201 && r.status !== 422).length;

          const finalRes = await fetch(`/accounts/${fromAcc}/ledger`, { headers: authHeaders });
          const finalData = await finalRes.json();
          const finalBalance = finalData.balance_paise;

          setRaceConditionResult({
            totalFired: 20,
            successes,
            insufficient,
            otherErrors,
            initialBalance,
            finalBalance,
          });

          showToast(`Race complete: ${successes} succeeded, ${insufficient} rejected. ₹0 overdraft`, 'success');
          refreshAll();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setChaosLoading(false);
        }
      };

      // Toggle Merchant Crash
      const toggleCrashMode = async () => {
        try {
          const res = await fetch('/mock-merchant/crash', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ crash: !merchantStatus.crashMode }),
          });
          const data = await res.json();
          setMerchantStatus((prev) => ({ ...prev, crashMode: data.crashMode }));
          showToast(data.crashMode ? 'Merchant server crashed (500 Error)' : 'Merchant server recovered (200 OK)', data.crashMode ? 'error' : 'success');
        } catch (e) {
          showToast(e.message, 'error');
        }
      };

      // Replay Outbox Event
      const replayEvent = async (id) => {
        try {
          const res = await fetch(`/outbox/${id}/replay`, { method: 'POST', headers: authHeaders });
          const data = await res.json();
          if (res.ok) {
            showToast('Event reset to PENDING for immediate redelivery', 'success');
            fetchOutbox();
          } else {
            showToast(data.message || 'Failed to replay event', 'error');
          }
        } catch (e) {
          showToast(e.message, 'error');
        }
      };

      const selectedAccount = accounts.find((a) => a.id === selectedAccountId);

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 flex items-center space-x-2 px-3.5 py-2.5 rounded-lg border text-xs font-medium shadow-md backdrop-blur-md bg-white/95 dark:bg-[#18181b]/95 border-slate-200 dark:border-[#27272a] text-slate-900 dark:text-zinc-100 transition-all">
              <span className={`w-1.5 h-1.5 rounded-full ${toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-500'}`} />
              <span>{toast.message}</span>
            </div>
          )}

          {/* Top Header */}
          <header className="border-b border-slate-200 dark:border-[#27272a] bg-white dark:bg-[#111113] sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
              {/* Left: Brand & 1-line subtitle */}
              <div className="flex items-center space-x-3">
                <div className="w-7 h-7 rounded-md bg-slate-900 dark:bg-zinc-100 flex items-center justify-center text-white dark:text-zinc-900 font-bold text-xs tracking-wider">
                  LF
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-semibold text-sm tracking-tight text-slate-900 dark:text-zinc-100">LedgerFlow</span>
                    <span className="hidden sm:inline-block text-[11px] text-slate-400 dark:text-zinc-500 font-mono">v1.0</span>
                  </div>
                  <p className="text-[11px] text-slate-500 dark:text-zinc-400 hidden sm:block">Idempotent Double-Entry Ledger</p>
                </div>
              </div>

              {/* Right: Actions */}
              <div className="flex items-center space-x-2 sm:space-x-3">
                <button
                  type="button"
                  onClick={handleResetDemo}
                  disabled={loading}
                  className="px-2.5 py-1.5 rounded-md text-xs font-medium border border-slate-200 dark:border-[#27272a] bg-white dark:bg-[#18181b] hover:bg-slate-50 dark:hover:bg-[#27272a] text-slate-700 dark:text-zinc-200 transition-colors flex items-center space-x-1.5 disabled:opacity-50"
                  title="Resets demo state and seeds Alice & Bob wallets"
                >
                  <svg className="w-3.5 h-3.5 text-slate-500 dark:text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                  </svg>
                  <span>Reset Demo</span>
                </button>

                <a
                  href="/docs"
                  target="_blank"
                  rel="noreferrer"
                  className="px-2.5 py-1.5 rounded-md text-xs font-medium border border-slate-200 dark:border-[#27272a] bg-white dark:bg-[#18181b] hover:bg-slate-50 dark:hover:bg-[#27272a] text-slate-700 dark:text-zinc-200 transition-colors flex items-center space-x-1.5"
                >
                  <span>API Docs</span>
                  <svg className="w-3 h-3 text-slate-400 dark:text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                  </svg>
                </a>

                {/* Light / Dark Mode Toggle */}
                <button
                  type="button"
                  onClick={toggleTheme}
                  className="p-1.5 rounded-md border border-slate-200 dark:border-[#27272a] bg-white dark:bg-[#18181b] hover:bg-slate-50 dark:hover:bg-[#27272a] text-slate-700 dark:text-zinc-200 transition-colors"
                  aria-label="Toggle Theme"
                  title={theme === 'dark' ? 'Switch to Light mode' : 'Switch to Dark mode'}
                >
                  {theme === 'dark' ? (
                    /* Sun Icon */
                    <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                  ) : (
                    /* Moon Icon */
                    <svg className="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* Main Content: Simple 2-Column Layout */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full flex flex-col lg:flex-row gap-6">
            
            {/* LEFT COLUMN: Actions (~40% width) */}
            <div className="w-full lg:w-[410px] shrink-0 space-y-4">
              
              {/* 1. Quick Transfer Card */}
              <div className="bg-white dark:bg-[#111113] border border-slate-200 dark:border-[#27272a] rounded-xl p-4 sm:p-5 shadow-sm space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-semibold text-slate-900 dark:text-zinc-100 tracking-tight">Quick Transfer</h2>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-400 border border-slate-200 dark:border-zinc-700">
                    ACID Double-Entry
                  </span>
                </div>

                <form onSubmit={handleTransfer} className="space-y-3.5">
                  {/* From Wallet */}
                  <div>
                    <label className="block text-[11px] font-medium text-slate-500 dark:text-zinc-400 mb-1">From Wallet</label>
                    <select
                      value={fromAcc}
                      onChange={(e) => setFromAcc(e.target.value)}
                      className="w-full text-xs rounded-lg px-2.5 py-2 border bg-white dark:bg-[#18181b] border-slate-200 dark:border-[#27272a] text-slate-900 dark:text-zinc-100 focus:outline-none focus:ring-1 focus:ring-slate-900 dark:focus:ring-zinc-100"
                    >
                      <option value="">Select source wallet...</option>
                      {accounts.map((a) => (
                        <option key={a.id} value={a.id}>
                          {a.owner_name} ({formatPaise(a.balance_paise)})
                        </option>
                      ))}
                    </select>
                  </div>

                  {/* To Wallet */}
                  <div>
                    <label className="block text-[11px] font-medium text-slate-500 dark:text-zinc-400 mb-1">To Wallet</label>
                    <select
                      value={toAcc}
                      onChange={(e) => setToAcc(e.target.value)}
                      className="w-full text-xs rounded-lg px-2.5 py-2 border bg-white dark:bg-[#18181b] border-slate-200 dark:border-[#27272a] text-slate-900 dark:text-zinc-100 focus:outline-none focus:ring-1 focus:ring-slate-900 dark:focus:ring-zinc-100"
                    >
                      <option value="">Select destination wallet...</option>
                      {accounts.map((a) => (
                        <option key={a.id} value={a.id}>
                          {a.owner_name} ({formatPaise(a.balance_paise)})
                        </option>
                      ))}
                    </select>
                  </div>

                  {/* Amount with currency symbol prefix & quick pills */}
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-[11px] font-medium text-slate-500 dark:text-zinc-400">Amount (INR)</label>
                      <div className="flex items-center space-x-1">
                        {['100', '250', '500'].map((val) => (
                          <button
                            key={val}
                            type="button"
                            onClick={() => setTransferAmountInr(val)}
                            className={`px-1.5 py-0.5 text-[10px] font-mono rounded border transition-colors ${
                              transferAmountInr === val
                                ? 'bg-slate-900 text-white border-slate-900 dark:bg-white dark:text-zinc-900 dark:border-white'
                                : 'bg-slate-50 dark:bg-[#18181b] text-slate-600 dark:text-zinc-400 border-slate-200 dark:border-[#27272a] hover:bg-slate-100 dark:hover:bg-[#27272a]'
                            }`}
                          >
                            ₹{val}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div className="relative">
                      <span className="absolute left-3 top-2 text-xs text-slate-400 dark:text-zinc-500 font-mono">₹</span>
                      <input
                        type="number"
                        min="1"
                        step="any"
